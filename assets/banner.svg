<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-label="AI Text Refiner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#151326"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="300" fill="url(#glow)"/>
  <circle cx="180" cy="340" r="260" fill="url(#glow)"/>

  <g transform="translate(96,140)">
    <rect width="120" height="120" rx="28" fill="url(#badge)"/>
    <text x="60" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#f5f6ff" text-anchor="middle">R</text>
  </g>

  <text x="252" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#f4f4f8">AI Text Refiner</text>
  <text x="254" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#9aa0b4">Draft anywhere. Press a hotkey. Get it refined in place.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <g transform="translate(254,258)">
      <rect width="132" height="46" rx="23" fill="#1f2230" stroke="#2a2e3e"/>
      <text x="66" y="30" fill="#e7e8ee" text-anchor="middle">Draft</text>
    </g>
    <path d="M400 281 l16 0 m-6 -6 l6 6 l-6 6" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="translate(430,258)">
      <rect width="150" height="46" rx="23" fill="#1f2230" stroke="#2a2e3e"/>
      <text x="75" y="30" fill="#e7e8ee" text-anchor="middle">Hotkey</text>
    </g>
    <path d="M594 281 l16 0 m-6 -6 l6 6 l-6 6" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="translate(624,258)">
      <rect width="146" height="46" rx="23" fill="#1f2230" stroke="#2a2e3e"/>
      <text x="73" y="30" fill="#e7e8ee" text-anchor="middle">Refine</text>
    </g>
    <path d="M784 281 l16 0 m-6 -6 l6 6 l-6 6" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="translate(814,258)">
      <rect width="166" height="46" rx="23" fill="#1f2230" stroke="#2a2e3e"/>
      <text x="83" y="30" fill="#e7e8ee" text-anchor="middle">In place</text>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <g transform="translate(254,330)">
      <rect width="118" height="40" rx="20" fill="rgba(129,140,248,0.12)" stroke="rgba(129,140,248,0.4)"/>
      <text x="59" y="26" fill="#c7cbff" text-anchor="middle">OpenAI</text>
    </g>
    <g transform="translate(384,330)">
      <rect width="138" height="40" rx="20" fill="rgba(129,140,248,0.12)" stroke="rgba(129,140,248,0.4)"/>
      <text x="69" y="26" fill="#c7cbff" text-anchor="middle">Anthropic</text>
    </g>
    <g transform="translate(534,330)">
      <rect width="120" height="40" rx="20" fill="rgba(129,140,248,0.12)" stroke="rgba(129,140,248,0.4)"/>
      <text x="60" y="26" fill="#c7cbff" text-anchor="middle">Gemini</text>
    </g>
  </g>
</svg>
